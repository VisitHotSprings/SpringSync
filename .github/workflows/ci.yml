# CI for github.com/VisitHotSprings/SpringSync (private).
name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      # Uses the free gitleaks CLI (MIT) pinned by checksum. The
      # gitleaks-action wrapper needs a paid license key for organization repos.
      - name: gitleaks (no secrets in the repo, SPEC §7.1)
        run: |
          curl -fsSLo gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks && rm gl.tgz
          ./gitleaks git --redact --no-banner --exit-code 1 .
          rm gitleaks
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: python -m pip install --require-hashes --no-deps -r requirements.lock
      - name: pinned rclone for integration tests
        run: |
          curl -fsSLo r.zip https://downloads.rclone.org/v1.75.2/rclone-v1.75.2-linux-amd64.zip
          echo "349ac8fba6ff65d6247043f1750cdcb518ec5d500ef91463a10d37c0ccdf3702  r.zip" | sha256sum -c -
          unzip -q r.zip && echo "ODNAS_TEST_RCLONE=$PWD/rclone-v1.75.2-linux-amd64/rclone" >> "$GITHUB_ENV"
      - run: python -m pytest -q
